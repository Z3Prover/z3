name: Java Full Flow

# Deliberately separate from fast PR tests and the publishing release workflow.
on:
  workflow_dispatch:
  push:
    branches: [feat/java-fatjar]
    paths:
      - '.github/workflows/java-full-flow.yml'
      - 'scripts/java/workflow_inputs.py'
      - 'scripts/mk_java_package.py'

permissions:
  contents: read

jobs:
  native:
    # A marked push bootstraps the new workflow on a fork without changing its
    # default branch; ordinary pushes do not start expensive native builds.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[java-full-flow]')
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, platform: linux-x64, architecture: x64}
          - {os: windows-2025, platform: win-x64, architecture: x64}
          - {os: macos-15, platform: osx-arm64, architecture: aarch64}
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.3'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          architecture: ${{ matrix.architecture }}
      - name: Build Linux distribution using existing upstream producer
        if: runner.os == 'Linux'
        run: python scripts/mk_unix_dist.py --nodotnet --nopython --arch=x64
      - name: Build macOS distribution using existing upstream producer
        if: runner.os == 'macOS'
        run: python scripts/mk_unix_dist.py --nodotnet --nopython --arch=arm64 --os=osx-13.3
      - name: Build Windows distribution using existing upstream producer
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -prerelease -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSPATH=%%i"
          call "%VSPATH%\VC\Auxiliary\Build\vcvarsall.bat" x64 || exit /b 1
          python scripts\mk_win_dist.py --x64-only --nodotnet --nopython --zip
      - name: Record build identity and checksum
        run: >-
          python scripts/java/workflow_inputs.py record --input-dir dist --out-dir build/native-receipt
          --platform ${{ matrix.platform }} --source-commit ${{ github.sha }}
          --repository ${{ github.repository }} --run-id ${{ github.run_id }} --run-attempt ${{ github.run_attempt }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: java-native-${{ matrix.platform }}
          path: |
            dist/**/*.zip
            build/native-receipt/*.json
          if-no-files-found: error
          retention-days: 7

  package:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts
            src/api/java
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: java-native-*
          path: native-artifacts
      - name: Validate source/run/attempt and collect existing build artifacts
        run: >-
          python scripts/java/workflow_inputs.py collect --input-dir native-artifacts --out-dir native-inputs
          --platform linux-x64 --platform win-x64 --platform osx-arm64 --source-commit ${{ github.sha }}
          --repository ${{ github.repository }} --run-id ${{ github.run_id }} --run-attempt ${{ github.run_attempt }}
      - name: Assemble JARs without recompiling native code
        shell: bash
        run: |
          version=$(cut -d. -f1-3 scripts/VERSION.txt | tr -d '\r\n')
          python scripts/mk_java_package.py --release-lock native-inputs/inputs.json \
            --artifacts-dir native-inputs --api-jar native-inputs/prepared-api.jar \
            --preparation native-inputs/preparation.json --out-dir java-packages \
            --platform linux-x64 --platform win-x64 --platform osx-arm64 \
            --group-id invalid.z3.prototype --artifact-id z3 --version "${version}-fullflow-SNAPSHOT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: java-fullflow-packages
          path: java-packages/*
          if-no-files-found: error
          retention-days: 7

  smoke:
    needs: package
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, platform: linux-x64, architecture: x64}
          - {os: windows-2025, platform: win-x64, architecture: x64}
          - {os: macos-15, platform: osx-arm64, architecture: aarch64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          architecture: ${{ matrix.architecture }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: java-fullflow-packages
          path: packages
      - name: Verify platform and shared universal JARs from this source build
        run: >-
          python scripts/java/smoke.py --packages packages
          --platform ${{ matrix.platform }} --jar-kind both --work-dir smoke-result
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: java-fullflow-smoke-${{ matrix.platform }}
          path: smoke-result/receipt.json
          if-no-files-found: warn
          retention-days: 7
