name: Java Maven Consumers

on:
  workflow_call:
    inputs:
      group-id:
        type: string
        default: invalid.z3.prototype

permissions:
  contents: read

jobs:
  consumer:
    env:
      JAVA_MAVEN_GROUP_ID: ${{ inputs.group-id }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, platform: linux-x64, architecture: x64}
          - {os: windows-2025, platform: win-x64, architecture: x64}
          - {os: macos-15, platform: osx-arm64, architecture: aarch64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          architecture: ${{ matrix.architecture }}
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '9.8.2'
          cache-read-only: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: java-maven-test-packages
          path: packages
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: java-maven-test-repository
          path: repository
      - name: Resolve platform and all JARs, plus the Maven automatic selector
        shell: bash
        run: >-
          python scripts/java/maven_consumer.py --packages packages --platform ${{ matrix.platform }}
          --work-dir consumer-result --gradle --repository repository
          --group-id "$JAVA_MAVEN_GROUP_ID"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: java-maven-consumer-${{ matrix.platform }}
          path: |
            consumer-result/receipt.json
            consumer-result/maven-auto/pom.xml
            consumer-result/maven-auto/classpath.txt
            consumer-result/maven-auto/unsupported-platform.pom
          if-no-files-found: warn
          retention-days: 7
