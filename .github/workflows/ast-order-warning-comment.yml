name: Determinism Linter PR Comment

on:
  workflow_run:
    workflows: [Determinism Linter, AST Order Warning Report]
    types: [completed]

permissions: {}

concurrency:
  group: ast-order-comment-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  comment:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled' &&
      github.event.workflow_run.conclusion != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      # workflow_run uses the default branch. Never check out or execute PR code
      # with this token; only read a bounded, validated JSON artifact as data.
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          path: trusted
          sparse-checkout: scripts/clang-tidy
          persist-credentials: false

      - uses: actions/download-artifact@v8.0.1
        if: github.event.workflow_run.conclusion == 'success'
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          name: ast-order-comparison-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/ast-order-comparison

      - name: Update the PR warning-count comment
        uses: actions/github-script@v9
        with:
          script: |
            const {post} = require('./trusted/scripts/clang-tidy/comment.js');
            const path = require('node:path');
            await post({github, context, core,
              reportPath: path.join(process.env.RUNNER_TEMP, 'ast-order-comparison', 'comparison.json')});
