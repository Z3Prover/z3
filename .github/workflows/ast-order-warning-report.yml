name: Determinism Linter

# All warning types share one clang-tidy invocation per translation unit.
# See scripts/clang-tidy/README.md.

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ast-order-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Determinism linter (${{ matrix.revision }})
    runs-on: ubuntu-24.04
    timeout-minutes: 160
    strategy:
      fail-fast: false
      matrix:
        revision: ${{ fromJSON(github.event_name == 'pull_request' && '["base", "head"]' || '["head"]') }}
    env:
      TESTED_SHA: ${{ github.sha }}
      REVISION: ${{ matrix.revision }}
    steps:
      # Both scans use exactly the same checker, including when the PR changes it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: tooling
          sparse-checkout: |
            scripts/clang-tidy
            .github/workflows
          # Depth 2 makes the PR merge commit's parents available below.
          fetch-depth: 2
          persist-credentials: false

      - name: Resolve the compared revisions
        run: |
          # Compare the PR merge result with its first parent, the base tip it
          # was merged onto, so a PR behind master does not appear to undo
          # warning fixes that are already upstream. pull_request.base.sha is
          # where the branch forked from the base and is usually older than
          # that parent; a depth-2 checkout of the merge does not contain it.
          base=""
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            git -C tooling rev-parse --verify -q "$TESTED_SHA^2" >/dev/null ||
              { echo "::error::$TESTED_SHA is not a PR merge commit"; exit 1; }
            base=$(git -C tooling rev-parse --verify "$TESTED_SHA^1")
          fi
          scan=$TESTED_SHA; other=$base
          if [[ "$REVISION" == base ]]; then scan=$base; other=$TESTED_SHA; fi
          { echo "PR_BASE_SHA=$base"; echo "SCAN_SHA=$scan"; echo "OTHER_SHA=$other"; } >> "$GITHUB_ENV"
          echo "scan=$scan other=$other"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SCAN_SHA }}
          path: source
          # A PR merge's first parent is the base used by affected.py's diff.
          fetch-depth: 2
          persist-credentials: false

      - name: Identify the scan cache
        id: scan-key
        env:
          CHECKER_HASH: ${{ hashFiles('tooling/scripts/clang-tidy/**', 'tooling/.github/workflows/ast-order-warning-report.yml') }}
        run: |
          # PR reports depend on the affected set from BOTH revisions. They
          # must not share a key with full reports or with another PR's scope.
          scope="full-$SCAN_SHA"
          if [[ -n "$PR_BASE_SHA" ]]; then scope="pr-$PR_BASE_SHA-$TESTED_SHA-$REVISION"; fi
          echo "key=z3-lint-v3-$RUNNER_OS-$RUNNER_ARCH-${ImageVersion:?}-llvm21.1.8-$CHECKER_HASH-$scope" >> "$GITHUB_OUTPUT"

      # Only successful jobs save a cache; PR caches remain scoped to that PR.
      - name: Restore a completed scan
        id: scan-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ast-order-report
          key: ${{ steps.scan-key.outputs.key }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request' && steps.scan-cache.outputs.cache-hit != 'true'
        with:
          ref: ${{ env.OTHER_SHA }}
          path: other-source
          fetch-depth: 2
          persist-credentials: false

      - name: Install LLVM 21.1.8
        if: steps.scan-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o /tmp/llvm.asc
          sudo install -m 644 /tmp/llvm.asc /usr/share/keyrings/llvm.asc
          echo 'deb [signed-by=/usr/share/keyrings/llvm.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main' \
            | sudo tee /etc/apt/sources.list.d/llvm-21.list
          sudo apt-get update
          sudo apt-get install -y clang-21 clang-tools-21 clang-tidy-21 llvm-21-dev libclang-21-dev ninja-build
          test "$(llvm-config-21 --version)" = '21.1.8'

      - name: Build the warning-only checker
        if: steps.scan-cache.outputs.cache-hit != 'true'
        run: |
          cmake -G Ninja -S tooling/scripts/clang-tidy -B build-tidy \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-21 -DCMAKE_CXX_COMPILER=clang++-21 \
            -DLLVM_DIR=/usr/lib/llvm-21/lib/cmake/llvm \
            -DCLANG_TIDY=/usr/bin/clang-tidy-21
          cmake --build build-tidy --parallel "$(nproc)"

      - name: Generate sources and the compilation database
        if: steps.scan-cache.outputs.cache-hit != 'true'
        run: |
          generate() {
            cmake -G Ninja -S "$1" -B "$2" \
              -DCMAKE_CXX_COMPILER=clang++-21 \
              -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
              -DZ3_INCLUDE_GIT_HASH=OFF -DZ3_INCLUDE_GIT_DESCRIBE=OFF \
              -DCMAKE_ADD_CUSTOM_COMMAND_DEPENDS_EXPLICIT_ONLY=ON
            # These Python generators declare all their inputs. Avoid CMake's
            # implicit component dependencies: clang-tidy needs no Z3 objects.
            cmake --build "$2" --parallel 2 --target \
              src/api/api_log_macros.h src/ast/pattern/database.h
          }
          generate source build
          if [[ -n "$PR_BASE_SHA" ]]; then generate other-source other-build; fi

      - name: Select PR sources and header dependents
        if: github.event_name == 'pull_request' && steps.scan-cache.outputs.cache-hit != 'true'
        run: |
          base_source=source; base_build=build
          head_source=other-source; head_build=other-build
          if [[ "$REVISION" == head ]]; then
            base_source=other-source; base_build=other-build
            head_source=source; head_build=build
          fi
          python3 tooling/scripts/clang-tidy/affected.py \
            --base-source "$base_source" --base-build "$base_build" \
            --head-source "$head_source" --head-build "$head_build" \
            --jobs "$(nproc)" --output ast-order-selection.json

      - name: Run the determinism linter
        if: steps.scan-cache.outputs.cache-hit != 'true'
        run: |
          rm -rf ast-order-report
          selection_args=()
          if [[ -n "$PR_BASE_SHA" ]]; then
            selection_args=(--selection ast-order-selection.json --revision "$REVISION")
          fi
          python3 tooling/scripts/clang-tidy/run.py \
            --clang-tidy clang-tidy-21 --plugin build-tidy/Z3TidyModule.so \
            --build build --source-root source --output ast-order-report --jobs "$(nproc)" "${selection_args[@]}"

      - name: Validate and print the warning count
        run: |
          python3 tooling/scripts/clang-tidy/compare.py \
            --head ast-order-report/summary.json --head-sha "$SCAN_SHA" --output scan-count
          cat ast-order-report/warnings.txt

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ast-order-${{ matrix.revision }}-${{ github.run_attempt }}
          path: ast-order-report
          if-no-files-found: warn
          retention-days: 14

  compare:
    needs: scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Resolve the compared base
        if: github.event_name == 'pull_request'
        run: |
          # The scans compared the merge commit with its first parent; see
          # "Resolve the compared revisions" above.
          echo "BASE_SHA=$(git rev-parse --verify HEAD^1)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ env.BASE_SHA }}
          path: base-source
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ast-order-head-${{ github.run_attempt }}
          path: reports/head

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: github.event_name == 'pull_request'
        with:
          name: ast-order-base-${{ github.run_attempt }}
          path: reports/base

      - name: Compare counts and write the job summary
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TESTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          base_args=()
          if [[ -n "$BASE_SHA" ]]; then
            base_args=(--base reports/base/summary.json --base-sha "$BASE_SHA"
                       --base-source base-source --head-source .)
          fi
          python3 scripts/clang-tidy/compare.py "${base_args[@]}" \
            --head reports/head/summary.json --head-sha "$HEAD_SHA" \
            --tested-sha "$TESTED_SHA" --output comparison
          node scripts/clang-tidy/comment.js comparison/comparison.json > comparison/summary.md
          cat comparison/summary.md
          cat comparison/summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ast-order-comparison-${{ github.run_attempt }}
          path: comparison/comparison.json
          retention-days: 14
