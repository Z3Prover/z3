name: Pulse verification and native checker regressions

on:
  workflow_run:
    workflows: [Build Pulse native checkers]
    types: [completed]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Build Pulse native checkers run ID to test
        type: string
        required: true
      z3test_ref:
        description: z3test branch, tag, or commit to test
        type: string
        default: master
      corpus_path:
        description: Directory in z3test (recursively selects .smt2 files)
        type: string
        default: regressions/proofs
      max_cases:
        description: Maximum inputs in sorted order (0 means all)
        type: number
        default: 0
      solver_timeout_ms:
        description: Per-input solving timeout in milliseconds
        type: number
        default: 10000
      case_timeout_seconds:
        description: Per-input timeout including solving, marshaling, and checking
        type: number
        default: 60
      total_timeout_seconds:
        description: z3test proof corpus execution budget in seconds
        type: number
        default: 1800
      smtlib_total_timeout_seconds:
        description: 225-input SMT-LIB sample execution budget in seconds
        type: number
        default: 3600
      extended_smtlib_total_timeout_seconds:
        description: 285-input datatype, nonlinear, quantified, and bit-vector sample budget in seconds
        type: number
        default: 3600
      qfbv_total_timeout_seconds:
        description: 300-input fixed QF_BV certificate execution budget in seconds
        type: number
        default: 1800
      qfff_total_timeout_seconds:
        description: 25-input QF_FF certificate execution budget in seconds
        type: number
        default: 600
      smtlib_sample_seed:
        description: Benchmark sampling/generation seed (empty uses this workflow run ID; reruns retain the seed)
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: pulse-checker-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

jobs:
  checker-build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_id: ${{ steps.run.outputs.run_id }}
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - name: Resolve the successful checker build
        id: run
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BUILD_RUN_ID: ${{ github.event.workflow_run.id || inputs.build_run_id }}
        with:
          script: |
            const id = process.env.BUILD_RUN_ID;
            if (!/^[1-9][0-9]*$/.test(id)) throw new Error('A checker build run ID is required');
            const {data: run} = await github.rest.actions.getWorkflowRun({
              ...context.repo, run_id: Number(id)
            });
            if (run.path.split('@')[0] !== '.github/workflows/pulse-checker-build.yml' ||
                run.status !== 'completed' || run.conclusion !== 'success' ||
                !/^[0-9a-f]{40}$/.test(run.head_sha)) {
              throw new Error('Expected a successful completed Pulse checker build');
            }
            core.setOutput('run_id', String(run.id));
            core.setOutput('run_head_sha', run.head_sha);
            core.setOutput('run_event', run.event);
            await core.summary.addLink('Checker build', run.html_url).write();

      - name: Download the build source metadata
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pulse-checker-build-report
          path: ${{ runner.temp }}/checker-build-report
          run-id: ${{ steps.run.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Resolve the actual checker source revision
        id: source
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SOURCE_FILE: ${{ runner.temp }}/checker-build-report/source.json
          RUN_HEAD_SHA: ${{ steps.run.outputs.run_head_sha }}
          PRODUCER_EVENT: ${{ steps.run.outputs.run_event }}
        with:
          script: |
            const fs = require('node:fs');
            let sha;
            if (fs.existsSync(process.env.SOURCE_FILE)) {
              sha = JSON.parse(fs.readFileSync(process.env.SOURCE_FILE, 'utf8')).source_sha;
            } else if (['push', 'pull_request', 'workflow_dispatch'].includes(process.env.PRODUCER_EVENT)) {
              core.info('Legacy checker build without source.json: using its triggering commit.');
              sha = process.env.RUN_HEAD_SHA;
            } else {
              throw new Error('Nightly-triggered checker build is missing its source revision');
            }
            if (!/^[0-9a-f]{40}$/.test(sha) ||
                (process.env.PRODUCER_EVENT !== 'workflow_run' && sha !== process.env.RUN_HEAD_SHA)) {
              throw new Error('Invalid or inconsistent checker source revision');
            }
            core.setOutput('source_sha', sha);
            await core.summary.addRaw(`\n\nSource revision: \`${sha}\`\n`).write();

  build-test-report:
    needs: checker-build
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      build_outcome: ${{ steps.build.outcome }}
      corpus_commit: ${{ steps.corpus_commit.outputs.commit }}
    defaults:
      run:
        shell: bash
    env:
      SOURCE_SHA: ${{ needs.checker-build.outputs.source_sha }}
      SMTLIB_SAMPLE_SEED: ${{ inputs.smtlib_sample_seed || github.run_id }}
    steps:
      - name: Checkout Z3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.checker-build.outputs.source_sha }}
          persist-credentials: false

      - name: Prepare report directory
        run: |
          mkdir -p "$RUNNER_TEMP/pulse-checker-report"
          echo "REPORT_DIR=$RUNNER_TEMP/pulse-checker-report" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/pulse-checker-report/smtlib-sample"
          mkdir -p "$RUNNER_TEMP/pulse-checker-report/smtlib-extended"
          mkdir -p "$RUNNER_TEMP/pulse-checker-report/qfbv"
          mkdir -p "$RUNNER_TEMP/pulse-checker-report/qfff"

      - name: Checkout z3test
        id: corpus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Z3Prover/z3test
          ref: ${{ inputs.z3test_ref || 'master' }}
          path: z3test
          persist-credentials: false

      - name: Set up benchmark Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Record the exact proof corpus revision
        id: corpus_commit
        run: echo "commit=$(git -C z3test rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install benchmark sampler dependencies
        timeout-minutes: 5
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/checker-benchmark-python"
          "$RUNNER_TEMP/checker-benchmark-python/bin/python" -m pip install \
            --disable-pip-version-check zstandard==0.25.0
          echo "BENCHMARK_PYTHON=$RUNNER_TEMP/checker-benchmark-python/bin/python" >> "$GITHUB_ENV"

      - name: Test the benchmark harness and sampler
        id: harness
        run: '"$BENCHMARK_PYTHON" -m unittest discover -s fstar/tools -p "test_checker_*.py" -v'

      - name: Download standalone OCaml checker from the completed build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pulse-checker-ocaml-linux-x86_64
          path: ${{ runner.temp }}/ocaml-artifact
          run-id: ${{ needs.checker-build.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Download checker build logs and timing
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pulse-checker-build-report
          path: ${{ env.REPORT_DIR }}
          run-id: ${{ needs.checker-build.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Install checker runtime libraries
        id: toolchain
        timeout-minutes: 5
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y libgmp10 libstdc++6

      - name: Unpack and test the OCaml checker without build toolchains
        id: build
        timeout-minutes: 5
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/ocaml-artifact"
          sha256sum --check pulse-checker-ocaml-linux-x86_64.tar.gz.sha256
          tar -xzf pulse-checker-ocaml-linux-x86_64.tar.gz
          checker="$PWD/pulse-checker-ocaml-linux-x86_64/checker"
          python3 -c 'import json, os; m = json.load(open("pulse-checker-ocaml-linux-x86_64/build.json")); assert m["commit"] == os.environ["SOURCE_SHA"], "Checker source revision mismatch"'
          printf '(assert false)\n' | env -i PATH=/usr/bin:/bin "$checker"
          Z3_FSTAR_CHECKER="$checker" python3 "$GITHUB_WORKSPACE/fstar/tools/test_native_checker.py"
          echo "CHECKER=$checker" >> "$GITHUB_ENV"

      - name: Run native checker on the proof corpus
        id: regressions
        timeout-minutes: 35
        env:
          CORPUS_PATH: ${{ inputs.corpus_path }}
          MAX_CASES: ${{ inputs.max_cases }}
          SOLVER_TIMEOUT_MS: ${{ inputs.solver_timeout_ms }}
          CASE_TIMEOUT_SECONDS: ${{ inputs.case_timeout_seconds }}
          TOTAL_TIMEOUT_SECONDS: ${{ inputs.total_timeout_seconds }}
        run: |
          set -euo pipefail
          python3 fstar/tools/run_checker_regressions.py run \
            --checker "$CHECKER" \
            --corpus "$GITHUB_WORKSPACE/z3test" --corpus-path "${CORPUS_PATH:-regressions/proofs}" \
            --corpus-commit "$(git -C z3test rev-parse HEAD)" \
            --max-cases "${MAX_CASES:-0}" --solver-timeout-ms "${SOLVER_TIMEOUT_MS:-10000}" \
            --case-timeout-seconds "${CASE_TIMEOUT_SECONDS:-60}" \
            --total-timeout-seconds "${TOTAL_TIMEOUT_SECONDS:-1800}" \
            --memory-limit-mb 2048 --output "$REPORT_DIR"

      - name: Sample 25 SMT-LIB benchmarks per logic from Zenodo
        id: smtlib_inputs
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.corpus.outcome == 'success' }}
        timeout-minutes: 30
        run: |
          set -euo pipefail
          "$BENCHMARK_PYTHON" fstar/tools/sample_checker_benchmarks.py \
            --manifest "$GITHUB_WORKSPACE/z3test/regressions/smtlib-sample/manifest.json" \
            --seed "$SMTLIB_SAMPLE_SEED" --output "$REPORT_DIR/smtlib-sample/inputs" \
            2>&1 | tee "$REPORT_DIR/smtlib-sample/sampling.log"

      - name: Run native checker on sampled SMT-LIB benchmarks
        id: smtlib
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.smtlib_inputs.outcome == 'success' }}
        timeout-minutes: 65
        env:
          SOLVER_TIMEOUT_MS: ${{ inputs.solver_timeout_ms }}
          CASE_TIMEOUT_SECONDS: ${{ inputs.case_timeout_seconds }}
          TOTAL_TIMEOUT_SECONDS: ${{ inputs.smtlib_total_timeout_seconds }}
        run: |
          set -euo pipefail
          python3 fstar/tools/run_checker_regressions.py run \
            --checker "$CHECKER" \
            --corpus "$REPORT_DIR/smtlib-sample/inputs" --corpus-path . \
            --corpus-commit "$(git -C z3test rev-parse HEAD)" \
            --manifest "$REPORT_DIR/smtlib-sample/inputs/manifest.json" \
            --expected-cases 225 \
            --solver-timeout-ms "${SOLVER_TIMEOUT_MS:-10000}" \
            --case-timeout-seconds "${CASE_TIMEOUT_SECONDS:-60}" \
            --total-timeout-seconds "${TOTAL_TIMEOUT_SECONDS:-3600}" \
            --memory-limit-mb 4096 --output "$REPORT_DIR/smtlib-sample"

      - name: Sample datatype, nonlinear, quantified, and bit-vector inputs from Zenodo
        id: extended_inputs
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 30
        run: |
          set -euo pipefail
          "$BENCHMARK_PYTHON" fstar/tools/sample_checker_benchmarks.py \
            --manifest "$GITHUB_WORKSPACE/fstar/benchmarks/smtlib-sample/manifest.json" \
            --skip-logic QF_BV \
            --seed "$SMTLIB_SAMPLE_SEED" --output "$REPORT_DIR/smtlib-extended/inputs" \
            2>&1 | tee "$REPORT_DIR/smtlib-extended/sampling.log"

      - name: Run datatype, nonlinear, quantified, and bit-vector samples
        id: extended
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.extended_inputs.outcome == 'success' }}
        timeout-minutes: 65
        env:
          SOLVER_TIMEOUT_MS: ${{ inputs.solver_timeout_ms }}
          CASE_TIMEOUT_SECONDS: ${{ inputs.case_timeout_seconds }}
          TOTAL_TIMEOUT_SECONDS: ${{ inputs.extended_smtlib_total_timeout_seconds }}
        run: |
          set -euo pipefail
          python3 fstar/tools/run_checker_regressions.py run \
            --checker "$CHECKER" \
            --corpus "$REPORT_DIR/smtlib-extended/inputs" --corpus-path . \
            --corpus-commit "$SOURCE_SHA" \
            --manifest "$REPORT_DIR/smtlib-extended/inputs/manifest.json" \
            --expected-cases 285 \
            --solver-timeout-ms "${SOLVER_TIMEOUT_MS:-10000}" \
            --case-timeout-seconds "${CASE_TIMEOUT_SECONDS:-60}" \
            --total-timeout-seconds "${TOTAL_TIMEOUT_SECONDS:-3600}" \
            --memory-limit-mb 4096 --output "$REPORT_DIR/smtlib-extended"

      - name: Prepare 300 fixed small UNSAT QF_BV inputs from z3test
        id: qfbv_inputs
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.corpus.outcome == 'success' }}
        run: |
          set -euo pipefail
          cp -a "$GITHUB_WORKSPACE/z3test/regressions/smtlib-qfbv" "$REPORT_DIR/qfbv/inputs"

      - name: Run native checker on 300 fixed QF_BV certificates
        id: qfbv
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.qfbv_inputs.outcome == 'success' }}
        timeout-minutes: 35
        env:
          SOLVER_TIMEOUT_MS: ${{ inputs.solver_timeout_ms }}
          CASE_TIMEOUT_SECONDS: ${{ inputs.case_timeout_seconds }}
          TOTAL_TIMEOUT_SECONDS: ${{ inputs.qfbv_total_timeout_seconds }}
        run: |
          set -euo pipefail
          python3 fstar/tools/run_checker_regressions.py run \
            --checker "$CHECKER" \
            --corpus "$REPORT_DIR/qfbv/inputs" --corpus-path . \
            --corpus-commit "$(git -C z3test rev-parse HEAD)" \
            --manifest "$REPORT_DIR/qfbv/inputs/manifest.json" --expected-cases 300 \
            --solver-timeout-ms "${SOLVER_TIMEOUT_MS:-10000}" \
            --case-timeout-seconds "${CASE_TIMEOUT_SECONDS:-60}" \
            --total-timeout-seconds "${TOTAL_TIMEOUT_SECONDS:-1800}" \
            --memory-limit-mb 4096 --output "$REPORT_DIR/qfbv"

      - name: Generate 25 exhaustively UNSAT QF_FF certificate inputs
        id: qfff_inputs
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.corpus.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          set -euo pipefail
          "$BENCHMARK_PYTHON" fstar/tools/prepare_checker_qfff.py \
            --z3test "$GITHUB_WORKSPACE/z3test" --seed "$SMTLIB_SAMPLE_SEED" \
            --output "$REPORT_DIR/qfff/inputs" \
            2>&1 | tee "$REPORT_DIR/qfff/generation.log"

      - name: Run native checker on 25 QF_FF certificates
        id: qfff
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.qfff_inputs.outcome == 'success' }}
        timeout-minutes: 15
        env:
          SOLVER_TIMEOUT_MS: ${{ inputs.solver_timeout_ms }}
          CASE_TIMEOUT_SECONDS: ${{ inputs.case_timeout_seconds }}
          TOTAL_TIMEOUT_SECONDS: ${{ inputs.qfff_total_timeout_seconds }}
        run: |
          set -euo pipefail
          python3 fstar/tools/run_checker_regressions.py run \
            --checker "$CHECKER" \
            --corpus "$REPORT_DIR/qfff/inputs" --corpus-path . \
            --corpus-commit "$(git -C z3test rev-parse HEAD)" \
            --manifest "$REPORT_DIR/qfff/inputs/manifest.json" --expected-cases 25 \
            --solver-timeout-ms "${SOLVER_TIMEOUT_MS:-10000}" \
            --case-timeout-seconds "${CASE_TIMEOUT_SECONDS:-60}" \
            --total-timeout-seconds "${TOTAL_TIMEOUT_SECONDS:-600}" \
            --memory-limit-mb 4096 --output "$REPORT_DIR/qfff"

      - name: Diagnose partial and rejected proofs separately
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 80
        run: |
          set -euo pipefail
          status=0
          for report in "$REPORT_DIR" "$REPORT_DIR/smtlib-sample" "$REPORT_DIR/smtlib-extended" "$REPORT_DIR/qfbv" "$REPORT_DIR/qfff"; do
            if [[ -f "$report/selection.json" && -f "$report/results.jsonl" ]]; then
              corpus="$report/inputs"
              if [[ "$report" == "$REPORT_DIR" ]]; then
                corpus="$GITHUB_WORKSPACE/z3test"
              fi
              python3 fstar/tools/run_checker_regressions.py diagnose \
                --checker "$CHECKER" \
                --corpus "$corpus" --output "$report" \
                --total-timeout-seconds 900 || status=1
            fi
          done
          exit "$status"

      - name: Publish coverage and timing report
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          CORPUS_OUTCOME: ${{ steps.corpus.outcome }}
          RUNNER_OUTCOME: ${{ steps.regressions.outcome }}
          TOOLCHAIN_OUTCOME: ${{ steps.toolchain.outcome }}
          HARNESS_OUTCOME: ${{ steps.harness.outcome }}
          SMTLIB_OUTCOME: ${{ steps.smtlib.outcome }}
          EXTENDED_OUTCOME: ${{ steps.extended.outcome }}
          SMTLIB_INPUTS_OUTCOME: ${{ steps.smtlib_inputs.outcome }}
          EXTENDED_INPUTS_OUTCOME: ${{ steps.extended_inputs.outcome }}
          QFBV_OUTCOME: ${{ steps.qfbv.outcome }}
          QFBV_INPUTS_OUTCOME: ${{ steps.qfbv_inputs.outcome }}
          QFFF_OUTCOME: ${{ steps.qfff.outcome }}
          QFFF_INPUTS_OUTCOME: ${{ steps.qfff_inputs.outcome }}
        run: |
          set -euo pipefail
          python3 fstar/tools/run_checker_regressions.py report --output "$REPORT_DIR"
          cat "$REPORT_DIR/report.md" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f "$REPORT_DIR/build.json" ]]; then
            cp "$REPORT_DIR/build.json" "$REPORT_DIR/smtlib-sample/build.json"
          fi
          SAMPLER_OUTCOME="$SMTLIB_INPUTS_OUTCOME" RUNNER_OUTCOME="$SMTLIB_OUTCOME" \
            python3 fstar/tools/run_checker_regressions.py report \
            --output "$REPORT_DIR/smtlib-sample"
          cat "$REPORT_DIR/smtlib-sample/report.md" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f "$REPORT_DIR/build.json" ]]; then
            cp "$REPORT_DIR/build.json" "$REPORT_DIR/smtlib-extended/build.json"
          fi
          SAMPLER_OUTCOME="$EXTENDED_INPUTS_OUTCOME" RUNNER_OUTCOME="$EXTENDED_OUTCOME" \
            python3 fstar/tools/run_checker_regressions.py report \
            --output "$REPORT_DIR/smtlib-extended"
          cat "$REPORT_DIR/smtlib-extended/report.md" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f "$REPORT_DIR/build.json" ]]; then
            cp "$REPORT_DIR/build.json" "$REPORT_DIR/qfbv/build.json"
          fi
          SAMPLER_OUTCOME="$QFBV_INPUTS_OUTCOME" RUNNER_OUTCOME="$QFBV_OUTCOME" \
            python3 fstar/tools/run_checker_regressions.py report \
            --output "$REPORT_DIR/qfbv"
          cat "$REPORT_DIR/qfbv/report.md" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f "$REPORT_DIR/build.json" ]]; then
            cp "$REPORT_DIR/build.json" "$REPORT_DIR/qfff/build.json"
          fi
          SAMPLER_OUTCOME="$QFFF_INPUTS_OUTCOME" RUNNER_OUTCOME="$QFFF_OUTCOME" \
            python3 fstar/tools/run_checker_regressions.py report \
            --output "$REPORT_DIR/qfff"
          cat "$REPORT_DIR/qfff/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports, per-case results, and build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pulse-checker-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.REPORT_DIR }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  cherry-regressions:
    needs: [checker-build, build-test-report]
    if: ${{ !cancelled() && needs.build-test-report.outputs.build_outcome == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    env:
      SOURCE_SHA: ${{ needs.checker-build.outputs.source_sha }}
    steps:
      - name: Checkout Z3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.checker-build.outputs.source_sha }}
          persist-credentials: false

      - name: Checkout the same z3test revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Z3Prover/z3test
          ref: ${{ needs.build-test-report.outputs.corpus_commit }}
          path: z3test
          persist-credentials: false

      - name: Download standalone Cherry checker
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pulse-checker-cherry-linux-x86_64
          path: ${{ runner.temp }}/cherry-artifact
          run-id: ${{ needs.checker-build.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Download the original sampled inputs and reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pulse-checker-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ocaml-report

      - name: Install Cherry runtime libraries
        timeout-minutes: 5
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository --yes ppa:ubuntu-toolchain-r/test
          sudo apt-get update -y
          sudo apt-get install -y libstdc++6

      - name: Unpack and test the downloadable checker without build toolchains
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/cherry-artifact"
          sha256sum --check pulse-checker-cherry-linux-x86_64.tar.gz.sha256
          tar -xzf pulse-checker-cherry-linux-x86_64.tar.gz
          checker="$PWD/pulse-checker-cherry-linux-x86_64/checker"
          python3 -c 'import json, os; m = json.load(open("pulse-checker-cherry-linux-x86_64/build.json")); assert m["commit"] == os.environ["SOURCE_SHA"], "Checker source revision mismatch"'
          printf '(assert false)\n' | env -i PATH=/usr/bin:/bin "$checker"
          Z3_FSTAR_CHECKER="$checker" python3 "$GITHUB_WORKSPACE/fstar/tools/test_native_checker.py"
          echo "CHECKER=$checker" >> "$GITHUB_ENV"
          echo "REPORT_DIR=$RUNNER_TEMP/cherry-report" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/cherry-report"

      - name: Replay the proof corpus, identical SMT-LIB samples, and fixed QF_BV and QF_FF inputs with Cherry
        id: regressions
        timeout-minutes: 210
        env:
          CORPUS_PATH: ${{ inputs.corpus_path }}
          MAX_CASES: ${{ inputs.max_cases }}
          SOLVER_TIMEOUT_MS: ${{ inputs.solver_timeout_ms }}
          CASE_TIMEOUT_SECONDS: ${{ inputs.case_timeout_seconds }}
          TOTAL_TIMEOUT_SECONDS: ${{ inputs.total_timeout_seconds }}
          SMTLIB_TIMEOUT_SECONDS: ${{ inputs.smtlib_total_timeout_seconds }}
          EXTENDED_TIMEOUT_SECONDS: ${{ inputs.extended_smtlib_total_timeout_seconds }}
          QFBV_TIMEOUT_SECONDS: ${{ inputs.qfbv_total_timeout_seconds }}
          QFFF_TIMEOUT_SECONDS: ${{ inputs.qfff_total_timeout_seconds }}
        run: |
          set -euo pipefail
          status=0
          python3 fstar/tools/run_checker_regressions.py run \
            --checker "$CHECKER" --corpus "$GITHUB_WORKSPACE/z3test" \
            --corpus-path "${CORPUS_PATH:-regressions/proofs}" \
            --corpus-commit "$(git -C z3test rev-parse HEAD)" --max-cases "${MAX_CASES:-0}" \
            --solver-timeout-ms "${SOLVER_TIMEOUT_MS:-10000}" \
            --case-timeout-seconds "${CASE_TIMEOUT_SECONDS:-60}" \
            --total-timeout-seconds "${TOTAL_TIMEOUT_SECONDS:-1800}" \
            --memory-limit-mb 2048 --output "$REPORT_DIR" || status=1
          for cohort in smtlib-sample smtlib-extended qfbv qfff; do
            count=225
            budget="${SMTLIB_TIMEOUT_SECONDS:-3600}"
            commit="$(git -C z3test rev-parse HEAD)"
            if [[ "$cohort" == smtlib-extended ]]; then
              count=285
              budget="${EXTENDED_TIMEOUT_SECONDS:-3600}"
              commit="$SOURCE_SHA"
            elif [[ "$cohort" == qfbv ]]; then
              count=300
              budget="${QFBV_TIMEOUT_SECONDS:-1800}"
            elif [[ "$cohort" == qfff ]]; then
              count=25
              budget="${QFFF_TIMEOUT_SECONDS:-600}"
            fi
            python3 fstar/tools/run_checker_regressions.py run \
              --checker "$CHECKER" --corpus "$RUNNER_TEMP/ocaml-report/$cohort/inputs" \
              --corpus-path . --corpus-commit "$commit" \
              --manifest "$RUNNER_TEMP/ocaml-report/$cohort/inputs/manifest.json" \
              --expected-cases "$count" --solver-timeout-ms "${SOLVER_TIMEOUT_MS:-10000}" \
              --case-timeout-seconds "${CASE_TIMEOUT_SECONDS:-60}" \
              --total-timeout-seconds "$budget" --memory-limit-mb 4096 \
              --output "$REPORT_DIR/$cohort" || status=1
          done
          exit "$status"

      - name: Publish Cherry coverage, timings, and diagnostics
        if: ${{ !cancelled() && steps.regressions.outcome != 'skipped' }}
        timeout-minutes: 80
        run: |
          set -euo pipefail
          status=0
          for cohort in proofs smtlib-sample smtlib-extended qfbv qfff; do
            report="$REPORT_DIR/$cohort"
            corpus="$RUNNER_TEMP/ocaml-report/$cohort/inputs"
            if [[ "$cohort" == proofs ]]; then
              report="$REPORT_DIR"
              corpus="$GITHUB_WORKSPACE/z3test"
            fi
            if [[ -f "$report/selection.json" && -f "$report/results.jsonl" ]]; then
              python3 fstar/tools/run_checker_regressions.py diagnose \
                --checker "$CHECKER" --corpus "$corpus" --output "$report" \
                --total-timeout-seconds 900 || status=1
            fi
            python3 fstar/tools/run_checker_regressions.py report --output "$report"
            cat "$report/report.md" >> "$GITHUB_STEP_SUMMARY"
          done
          exit "$status"

      - name: Upload Cherry coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pulse-checker-cherry-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cherry-report
          if-no-files-found: warn
          retention-days: 14
