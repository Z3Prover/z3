name: MSVC Static Build
  
on:
  schedule:
    - cron: '0 0 */2 * *'

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  build:
    runs-on: windows-latest
    env:
      BUILD_TYPE: Release
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v7.0.1
  
    - name: Build
      run: |
        cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DBUILD_SHARED_LIBS=OFF -DZ3_BUILD_LIBZ3_MSVC_STATIC=ON
        cmake --build build --config ${{ env.BUILD_TYPE }} --parallel
        
