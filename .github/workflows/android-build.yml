name: Android Build

on:
  schedule:
    - cron: '0 0 */2 * *'
  workflow_dispatch:

env:
  BUILD_TYPE: Release

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        android-abi: [arm64-v8a, armeabi-v7a, x86, x86_64]

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Configure CMake and build
      run:  |
        cmake -G "Unix Makefiles" -S . -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DCMAKE_SYSTEM_NAME=Android -DCMAKE_ANDROID_API=21 -DCMAKE_ANDROID_ARCH_ABI=${{ matrix.android-abi }} "-DCMAKE_ANDROID_NDK=$ANDROID_NDK_LATEST_HOME" -DZ3_BUILD_JAVA_BINDINGS=TRUE
        cmake --build build --parallel "$(nproc)"
        cd build
        tar -cvf z3-build-${{ matrix.android-abi }}.tar ./*.jar ./*.so

    - name: Archive production artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: android-build-${{ matrix.android-abi }}
        path: build/z3-build-${{ matrix.android-abi }}.tar
