name: Build Pulse native checkers

on:
  push:
    paths:
      - 'fstar/**'
      - '.github/workflows/pulse-checker-build.yml'
      - '.github/workflows/pulse-checker-regressions.yml'
  pull_request:
    paths:
      - 'fstar/**'
      - '.github/workflows/pulse-checker-build.yml'
      - '.github/workflows/pulse-checker-regressions.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pulse-checker-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      FSTAR_VERSION: v2026.09.27
      FSTAR_SHA256: cafbbb8960efeb26f5d30bc447b61ab8a507968948507a2580585afd1397781d
      CHERRY_FSTAR_VERSION: nightly-2026-10-23
      CHERRY_FSTAR_SHA256: 396bf9063bf9261b2e353d725c63666cda68e0d17c5d787ebe3d9a63913f7ec7
      OPAM_SWITCH: fstar53
    steps:
      - name: Checkout Z3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # workflow_run.head_sha identifies this same source revision downstream.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Prepare build report directory
        run: |
          mkdir -p "$RUNNER_TEMP/pulse-checker-build-report"
          echo "REPORT_DIR=$RUNNER_TEMP/pulse-checker-build-report" >> "$GITHUB_ENV"

      - name: Install pinned F*, Cherry, and OCaml toolchains
        timeout-minutes: 30
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository --yes ppa:ubuntu-toolchain-r/test
          sudo apt-get update -y
          sudo apt-get install -y cmake ninja-build g++ gcc-15 g++-15 libgmp-dev opam pkg-config python3 curl
          archive="$RUNNER_TEMP/fstar.tar.gz"
          curl --fail --location --retry 3 \
            "https://github.com/FStarLang/FStar/releases/download/$FSTAR_VERSION/fstar-$FSTAR_VERSION-Linux-x86_64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$FSTAR_SHA256" "$archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/fstar-toolchain"
          tar -xzf "$archive" -C "$RUNNER_TEMP/fstar-toolchain" --strip-components=2
          "$RUNNER_TEMP/fstar-toolchain/bin/fstar.exe" --version
          cherry_archive="$RUNNER_TEMP/fstar-cherry.tar.gz"
          curl --fail --location --retry 3 \
            "https://github.com/FStarLang/FStar-nightly/releases/download/$CHERRY_FSTAR_VERSION/fstar-Linux-x86_64.tar.gz" \
            --output "$cherry_archive"
          printf '%s  %s\n' "$CHERRY_FSTAR_SHA256" "$cherry_archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/fstar-cherry-toolchain"
          tar -xzf "$cherry_archive" -C "$RUNNER_TEMP/fstar-cherry-toolchain" --strip-components=2
          "$RUNNER_TEMP/fstar-cherry-toolchain/bin/fstar.exe" --version
          gcc-15 --version
          g++-15 --version
          opam init --disable-sandboxing --bare --yes
          opam switch create "$OPAM_SWITCH" ocaml-base-compiler.5.3.0 --yes
          opam install --switch="$OPAM_SWITCH" ocamlfind zarith --yes
          opam exec --switch="$OPAM_SWITCH" -- ocamlc -version

      - name: Build Z3, verify Pulse, and test both standalone checkers
        timeout-minutes: 120
        run: |
          set -euo pipefail
          eval "$(opam env --switch="$OPAM_SWITCH")"
          start=$SECONDS
          if pwsh -NoProfile -File fstar/tools/build_ocaml_checker.ps1 \
            -FstarExe "$RUNNER_TEMP/fstar-toolchain/bin/fstar.exe" \
            -Z3WindowsBuildDir "$RUNNER_TEMP/checker-z3-build" \
            -Z3InstallDir "$RUNNER_TEMP/checker-z3-install" \
            -CacheDir "$RUNNER_TEMP/checker-fstar-cache" \
            -WslBuildDir "$RUNNER_TEMP/native-checker" \
            -OpamSwitch "$OPAM_SWITCH" -BuildJobs 4 -RunTests -BuildCherry \
            -CherryFstarExe "$RUNNER_TEMP/fstar-cherry-toolchain/bin/fstar.exe" \
            2>&1 | tee "$REPORT_DIR/build.log"; then
            status=0
          else
            status=$?
          fi
          printf '{"wall_seconds":%d,"exit_code":%d,"fstar_version":"%s","ocaml_version":"5.3.0"}\n' \
            "$((SECONDS - start))" "$status" "$FSTAR_VERSION" > "$REPORT_DIR/build.json"
          exit "$status"

      - name: Package and smoke-test the standalone checker artifacts
        run: |
          set -euo pipefail
          eval "$(opam env --switch="$OPAM_SWITCH")"
          python3 fstar/tools/package_checker.py \
            --checker "$RUNNER_TEMP/native-checker/checker" --backend ocaml \
            --fstar "$RUNNER_TEMP/fstar-toolchain/bin/fstar.exe" \
            --extra-license "$(opam var doc)/ocaml/LICENSE" \
            --extra-license "$(opam var prefix)/.opam-switch/sources/zarith.$(opam var zarith:version)/LICENSE" \
            --output-dir "$RUNNER_TEMP/checker-artifacts/ocaml"
          python3 fstar/tools/package_checker.py \
            --checker "$RUNNER_TEMP/native-checker/cherry/checker" --backend cherry \
            --fstar "$RUNNER_TEMP/fstar-cherry-toolchain/bin/fstar.exe" \
            --output-dir "$RUNNER_TEMP/checker-artifacts/cherry"

      - name: Upload standalone OCaml checker
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pulse-checker-ocaml-linux-x86_64
          path: ${{ runner.temp }}/checker-artifacts/ocaml/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload standalone Cherry checker
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pulse-checker-cherry-linux-x86_64
          path: ${{ runner.temp }}/checker-artifacts/cherry/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs and timing
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pulse-checker-build-report
          path: ${{ runner.temp }}/pulse-checker-build-report
          if-no-files-found: error
          retention-days: 14
