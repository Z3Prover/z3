name: Build Pulse native checkers

on:
  push:
    paths:
      - 'fstar/**'
      - '.github/workflows/pulse-checker-build.yml'
      - '.github/workflows/pulse-checker-regressions.yml'
      - '.github/scripts/install-pulse-checker-toolchains.sh'
  pull_request:
    paths:
      - 'fstar/**'
      - '.github/workflows/pulse-checker-build.yml'
      - '.github/workflows/pulse-checker-regressions.yml'
      - '.github/scripts/install-pulse-checker-toolchains.sh'
  workflow_run:
    workflows: [Nightly Build]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pulse-checker-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.path == '.github/workflows/nightly.yml' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch &&
       (github.event.workflow_run.event == 'schedule' ||
        github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      FSTAR_VERSION: v2026.10.25
      FSTAR_SHA256: a716153960545bc26b9d093f55614fedc716a202e4daa1665e5c63e4a2fb04e4
      CHERRY_FSTAR_VERSION: nightly-2026-10-30
      CHERRY_FSTAR_SHA256: 7910823f077f66d516d6901fafc78659a3c6a8f300caa7981cc56809a9f37994
      OPAM_SWITCH: fstar53
    steps:
      - name: Checkout Z3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Prepare build report directory
        run: |
          mkdir -p "$RUNNER_TEMP/pulse-checker-build-report"
          echo "REPORT_DIR=$RUNNER_TEMP/pulse-checker-build-report" >> "$GITHUB_ENV"
          printf '{"source_sha":"%s"}\n' "$(git rev-parse HEAD)" \
            > "$RUNNER_TEMP/pulse-checker-build-report/source.json"

      - name: Install pinned F*, Cherry, and OCaml toolchains
        timeout-minutes: 30
        run: bash .github/scripts/install-pulse-checker-toolchains.sh

      - name: Build Z3, verify the checker dependency closure, and link both standalone checkers
        timeout-minutes: 120
        run: |
          set -euo pipefail
          eval "$(opam env --switch="$OPAM_SWITCH")"
          start=$SECONDS
          if pwsh -NoProfile -File fstar/tools/build_ocaml_checker.ps1 \
            -FstarExe "$RUNNER_TEMP/fstar-toolchain/bin/fstar.exe" \
            -Z3WindowsBuildDir "$RUNNER_TEMP/checker-z3-build" \
            -Z3InstallDir "$RUNNER_TEMP/checker-z3-install" \
            -CacheDir "$RUNNER_TEMP/checker-fstar-cache" \
            -WslBuildDir "$RUNNER_TEMP/native-checker" -ReportDir "$REPORT_DIR" \
            -OpamSwitch "$OPAM_SWITCH" -BuildJobs 4 -BuildCherry \
            -CherryFstarExe "$RUNNER_TEMP/fstar-cherry-toolchain/bin/fstar.exe" \
            2>&1 | tee "$REPORT_DIR/build.log"; then
            status=0
          else
            status=$?
          fi
          printf '{"mode":"checker","wall_seconds":%d,"exit_code":%d,"fstar_version":"%s","ocaml_version":"5.3.0"}\n' \
            "$((SECONDS - start))" "$status" "$FSTAR_VERSION" > "$REPORT_DIR/build.json"
          exit "$status"

      - name: Package and smoke-test the standalone checker artifacts
        run: |
          set -euo pipefail
          eval "$(opam env --switch="$OPAM_SWITCH")"
          python3 fstar/tools/package_checker.py \
            --checker "$RUNNER_TEMP/native-checker/checker" --backend ocaml \
            --fstar "$RUNNER_TEMP/fstar-toolchain/bin/fstar.exe" \
            --extra-license "$(opam var doc)/ocaml/LICENSE" \
            --extra-license "$(opam var prefix)/.opam-switch/sources/zarith.$(opam var zarith:version)/LICENSE" \
            --output-dir "$RUNNER_TEMP/checker-artifacts/ocaml"
          python3 fstar/tools/package_checker.py \
            --checker "$RUNNER_TEMP/native-checker/cherry/checker" --backend cherry \
            --fstar "$RUNNER_TEMP/fstar-cherry-toolchain/bin/fstar.exe" \
            --output-dir "$RUNNER_TEMP/checker-artifacts/cherry"

      - name: Upload standalone OCaml checker
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pulse-checker-ocaml-linux-x86_64
          path: ${{ runner.temp }}/checker-artifacts/ocaml/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload standalone Cherry checker
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pulse-checker-cherry-linux-x86_64
          path: ${{ runner.temp }}/checker-artifacts/cherry/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs and timing
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pulse-checker-build-report
          path: ${{ runner.temp }}/pulse-checker-build-report
          if-no-files-found: error
          retention-days: 14

  publish-nightly:
    needs: build
    if: ${{ github.event_name == 'workflow_run' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      # Serialize with nightly.yml so its deploy cannot replace the release mid-upload.
      group: nightly-release
      cancel-in-progress: false
    steps:
      - name: Checkout the trusted release publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts/publish-pulse-nightly.cjs
          sparse-checkout-cone-mode: false

      - name: Download OCaml checker package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pulse-checker-ocaml-linux-x86_64
          path: ${{ runner.temp }}/nightly-checkers/ocaml

      - name: Download Cherry checker package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pulse-checker-cherry-linux-x86_64
          path: ${{ runner.temp }}/nightly-checkers/cherry

      - name: Attach checker packages to the matching Nightly release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CHECKER_ARTIFACT_DIR: ${{ runner.temp }}/nightly-checkers
        with:
          script: |
            const { publish } = require('./.github/scripts/publish-pulse-nightly.cjs');
            await publish({ github, context, core, artifactDir: process.env.CHECKER_ARTIFACT_DIR });
