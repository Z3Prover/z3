name: Java Packaging Test

on:
  pull_request:
    paths:
      - '.github/workflows/java-packaging.yml'
      - 'scripts/update_api.py'
      - 'scripts/mk_java_package.py'
      - 'scripts/java/**'
      - 'scripts/tests/test_java_package.py'
      - 'src/api/java/**'
  push:
    branches: [feat/java-fatjar]
    paths:
      - '.github/workflows/java-packaging.yml'
      - 'scripts/update_api.py'
      - 'scripts/mk_java_package.py'
      - 'scripts/java/**'
      - 'scripts/tests/test_java_package.py'
      - 'src/api/java/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java-packaging-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts
            src/api/java
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Packaging regression tests
        run: python -m unittest discover -s scripts/tests -p test_java_package.py -v
      - name: Prepare current-branch classes with pinned release JNI inputs
        run: >-
          python scripts/java/prepare.py --work-dir build/java-test
          --platform linux-x64 --platform win-x64 --platform osx-arm64
      - name: Assemble immutable test artifacts
        run: >-
          python scripts/mk_java_package.py --release-lock scripts/java/release.json
          --artifacts-dir build/java-test/downloads --api-jar build/java-test/prepared-api.jar
          --preparation build/java-test/preparation.json --out-dir build/java-packages
          --platform linux-x64 --platform win-x64 --platform osx-arm64
          --group-id invalid.z3.prototype --artifact-id z3 --version 5.3.2-packaging-SNAPSHOT
      - name: Repeat assembly with identical inputs
        run: |
          python scripts/mk_java_package.py --release-lock scripts/java/release.json \
            --artifacts-dir build/java-test/downloads --api-jar build/java-test/prepared-api.jar \
            --preparation build/java-test/preparation.json --out-dir build/java-repeat \
            --platform linux-x64 --platform win-x64 --platform osx-arm64 \
            --group-id invalid.z3.prototype --artifact-id z3 --version 5.3.2-packaging-SNAPSHOT
          diff build/java-packages/SHA256SUMS build/java-repeat/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: java-packages
          path: build/java-packages/*
          if-no-files-found: error
          retention-days: 7

  smoke:
    needs: package
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, platform: linux-x64, architecture: x64, java: '8'}
          - {os: ubuntu-24.04, platform: linux-x64, architecture: x64, java: '17'}
          - {os: windows-2025, platform: win-x64, architecture: x64, java: '8'}
          - {os: windows-2025, platform: win-x64, architecture: x64, java: '17'}
          - {os: macos-15, platform: osx-arm64, architecture: aarch64, java: '17'}
          - {os: macos-15, platform: osx-arm64, architecture: aarch64, java: '21'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          architecture: ${{ matrix.architecture }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: java-packages
          path: packages
      - name: Verify exact artifact and native behavior
        run: >-
          python scripts/java/smoke.py --packages packages
          --platform ${{ matrix.platform }} --work-dir smoke-result
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: java-smoke-${{ matrix.platform }}-${{ matrix.java }}
          path: smoke-result/receipt.json
          if-no-files-found: warn
          retention-days: 7
